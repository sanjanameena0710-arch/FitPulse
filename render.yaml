# The API runs on Render. Set DATABASE_URL to a PostgreSQL provider connection
# (Neon is recommended for a long-term free database).
services:
  - type: web
    name: fitpulse-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/db exec drizzle-kit push --config ./drizzle.config.ts && pnpm --filter @workspace/api-server run build
    startCommand: node artifacts/api-server/dist/index.cjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
